name: Build desktop app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: |
              dist/*.dmg
              dist/*.pkg
              dist/*.zip
          - platform: Windows
            os: windows-latest
            target: ""
            rust_targets: ""
            artifacts: |
              dist/*.exe
              dist/*.msi
              dist/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm ci

      - name: Use tag as version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test backend (billing, sign-in, workflow, restore)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build app and installers
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DigitalLibrary-${{ matrix.platform }}-${{ env.APP_VERSION || 'build' }}-${{ github.run_number }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Digital Library $GITHUB_REF_NAME" \
            --generate-notes
