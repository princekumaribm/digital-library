name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Use tag as version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build app, installer, disk image and zip
        run: ./build_release.sh

      - name: Smoke test the built app
        run: |
          set -euo pipefail
          URL=http://127.0.0.1:8799
          LIBRARY_DATA_DIR="$(mktemp -d)" LIBRARY_PORT=8799 \
            "dist/Digital Library.app/Contents/MacOS/DigitalLibrary" --no-browser &
          for _ in $(seq 1 30); do curl -sf "$URL/api/health" && break; sleep 1; done
          curl -sf -o /dev/null "$URL/"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/members")" = 401
          curl -sf -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}' "$URL/api/auth/login"
          curl -sf -b cookies.txt -o /dev/null "$URL/api/members"
          curl -sf -b cookies.txt -X POST -H 'Content-Type: application/json' -d '{}' "$URL/api/shutdown"

      - uses: actions/upload-artifact@v4
        with:
          name: DigitalLibrary-${{ env.APP_VERSION || 'build' }}-${{ github.run_number }}
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Digital Library $GITHUB_REF_NAME" \
            --generate-notes
