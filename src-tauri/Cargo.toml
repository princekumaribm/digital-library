[package]
name = "digital-library"
version = "1.0.0"
description = "Offline check-in/check-out and billing for library computers"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = "0.4"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
rust_decimal = "1"
dirs = "5"
csv = "1"
form_urlencoded = "1"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
